name: Weekly Mood Digest

on:
  schedule:
    # Runs every Sunday 02:30 UTC (08:00 IST)
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recreate sensitive files from Secrets
        run: |
          mkdir -p automation
          # Write OAuth client (credentials.json)
          echo "${GMAIL_CLIENT_JSON}" > automation/credentials.json
          # Write OAuth token (token.json) generated from your local first run
          echo "${GMAIL_TOKEN_JSON}" > automation/token.json
          # Write Firebase Admin service account
          echo "${FIREBASE_SERVICE_JSON}" > automation/firebase-service.json
        env:
          GMAIL_CLIENT_JSON: ${{ secrets.GMAIL_CLIENT_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          FIREBASE_SERVICE_JSON: ${{ secrets.FIREBASE_SERVICE_JSON }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-auth-oauthlib google-api-python-client firebase-admin openai

      - name: Run weekly digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python automation/send_digest_gmail.py
